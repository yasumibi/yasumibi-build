name: 週1回のアクセス集計

on:
  schedule:
    - cron: "7 22 * * 0"   # 毎週月曜 7:07（日本時間）。先週（月〜日）の分
  workflow_dispatch:
    inputs:
      day:
        description: "集計する週に入る日（空欄＝先週。例: 2026-10-19）"
        default: ""
      save:
        description: "yasumibi-data に保存する（yes / no。お試しは no）"
        default: "yes"
      check:
        description: "AIクローラーを「いまから過去7日間」でも数えて、画面の数字とくらべる（yes / no）"
        default: "no"

permissions:
  contents: read

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: yasumibi/yasumibi-data, token: "${{ secrets.SITE_PUSH_TOKEN }}", path: data }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: GA4 と Cloudflare から取り出す
        env:
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          YB_DATA: ${{ github.workspace }}/data
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
          YB_AI_CHECK: ${{ github.event.inputs.check == 'yes' && '1' || '' }}
        run: |
          pip install -q google-auth requests
          python3 tools/fetch_analytics.py ${{ github.event.inputs.day }}
      - name: 結果の概要（鍵は出さない）
        run: |
          python3 - <<'PY'
          import json, glob
          f = sorted(glob.glob('data/analytics/*.json'))[-1]; d = json.load(open(f))
          print(f"::notice title=GA4::{list(d['ga4'])} totals={d['ga4'].get('totals')}")
          print(f"::notice title=Cloudflare::{list(d['cloudflare'])} totals={d['cloudflare'].get('totals')} sites={d['cloudflare'].get('sites')}")
          sc = d.get('search_console') or {}; print(f"::notice title=Search Console::site={sc.get('site')} totals={sc.get('totals')} 途中の日={sc.get('provisional_days')}")
          print(f"::notice title=表示があったページ::{sc.get('pages_with_impressions')} queries={len(sc.get('queries') or [])} pages={len(sc.get('pages') or [])}")
          pk = d.get('pack_check') or {}; print(f"::{'notice' if pk.get('ok') else 'warning'} title=楽パックのリンク::{'開けています' if pk.get('ok') else '形が変わった可能性があります'} {pk.get('hotels')}")
          g = d['ga4']; lb = g.get('landing_by_source') or {}
          print(f"::notice title=流入元×着地::{ {k: v[:3] for k, v in list(lb.items())[:4]} }")
          print(f"::notice title=流入元×楽天・カード::{(g.get('events_by_source') or [])[:12]}")
          print(f"::notice title=運営者の目印::{g.get('internal_test')}")
          ai = d.get('ai_crawlers') or {}
          print(f"::notice title=AIクローラー（先週）::{ {k: (v['total'], v['ok_2xx'], v['not_ok']) for k, v in (ai.get('bots') or {}).items()} }")
          if d.get('ai_crawlers_check_last7'): print(f"::notice title=AIクローラー（過去7日間・確かめ用）::{d['ai_crawlers_check_last7']}")
          print(f"::notice title=AI・4xxのページ::{[(x['path'], x['count'], x['bots']) for x in (ai.get('paths_4xx') or [])[:8]]}")
          print(f"::notice title=AI・一覧にないbot::{[(x['user_agent'][:60], x['count']) for x in (ai.get('other_bot_uas') or [])[:10]]}")
          for e in d['errors']: print(f"::warning title={e['where']}::{e['error'][:600]}")
          PY
      - name: 非公開の yasumibi-data に保存
        if: ${{ github.event.inputs.save != 'no' }}
        working-directory: data
        run: |
          git config user.name "yasumibi-bot"; git config user.email "yasumibi@users.noreply.github.com"
          git add analytics/
          git diff --cached --quiet || git commit -m "アクセス集計 $(ls -t analytics | head -1 | sed 's/.json//')"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
