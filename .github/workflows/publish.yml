name: サイトを作り直して公開

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5      # 長い料金更新のあとでも、いちばん新しいサイトの作り方で作る
        with: { ref: main }
      - uses: actions/checkout@v5
        with: { repository: yasumibi/yasumibi-data, token: "${{ secrets.SITE_PUSH_TOKEN }}", path: data }
      - uses: actions/checkout@v5
        with: { repository: yasumibi/yasumibi-site, token: "${{ secrets.SITE_PUSH_TOKEN }}", path: site }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: 宿ページの写真の大きさを調べて保存（まだの写真だけ。CLS対策）
        continue-on-error: true   # 失敗しても公開は止めない（写真の大きさが書けないだけ）
        run: |
          python3 tools/img_size.py
          cd data
          git config user.name "yasumibi-bot"; git config user.email "yasumibi@users.noreply.github.com"
          git add img_sizes.json
          if ! git diff --cached --quiet; then
            git commit -m "写真の大きさ $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          fi
      - name: サイトを作り直す
        env:
          YB_OUT: ${{ github.workspace }}/site
        run: |
          if python3 tools/make_og.py --need; then   # 画像が無い宿・宿名や地区名が変わった宿だけ作り直す
            pip install -q pillow && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null && python3 tools/make_og.py || echo "シェア画像は次回に作ります"
          fi
          python3 tools/build_hotel.py
          python3 tools/build_card.py
          python3 tools/build_cards.py
          python3 tools/build_rank.py
          python3 tools/build_renkyu.py
          python3 tools/build_guides.py
          python3 tools/build_tags.py
          python3 tools/build_favs.py
          python3 tools/build_site.py
          python3 tools/build_specials.py
          python3 tools/build_top2.py
          python3 tools/build_search.py
          python3 tools/build_404.py
          python3 tools/add_jsonld.py      # 構造化データ（パンくず・宿の一覧）。見た目は変わらない
          python3 tools/add_analytics.py   # 全ページにアクセス解析（GA4）を入れる。いちばん最後に動かす
      - name: 公開
        working-directory: site
        run: |
          git config user.name "yasumibi-bot"; git config user.email "yasumibi@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "料金更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
